<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confluent Self-Service Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <h1>🌿 Confluent Self-Service Portal</h1>
    <p>Create Kafka topics cleanly with governance and approval flow</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message|safe }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/submit" method="POST">
      <label for="topic_name">Topic Name:</label>
      <input type="text" id="topic_name" name="topic_name" required>

      <label for="partitions">Number of Partitions:</label>
      <input type="number" id="partitions" name="partitions" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" placeholder="Brief description..."></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </div>
</body>
</html>
